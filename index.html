<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyAI — Регистрация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 40%, #1a1f35, #07090f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(12, 16, 35, 0.8);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 30px;
            border: 1px solid rgba(0, 180, 255, 0.2);
            box-shadow: 0 30px 80px rgba(0, 80, 255, 0.15);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #0088ff, #4400ff);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 800; color: white;
            margin: 0 auto 10px;
            box-shadow: 0 0 40px rgba(0,100,255,0.3);
        }
        .logo h1 { font-size: 32px; background: linear-gradient(90deg, #00ccff, #7766ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #667799; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: #8899bb; font-size: 13px; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 14px 18px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.35);
            color: #e0e8ff; font-size: 15px; outline: none;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: rgba(0,180,255,0.4); box-shadow: 0 0 20px rgba(0,100,255,0.08); }
        .form-group input::placeholder { color: #556688; }
        button {
            width: 100%; padding: 16px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, #0088ff, #5500ff);
            color: white; font-weight: 600; font-size: 16px; cursor: pointer;
            transition: 0.3s; box-shadow: 0 0 30px rgba(0,100,255,0.15);
        }
        button:hover { transform: scale(1.02); box-shadow: 0 0 50px rgba(0,100,255,0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .message { margin-top: 16px; padding: 14px; border-radius: 16px; text-align: center; font-size: 14px; display: none; }
        .message.success { display: block; background: rgba(0,255,150,0.08); border: 1px solid rgba(0,255,150,0.15); color: #66ffaa; }
        .message.error { display: block; background: rgba(255,50,50,0.08); border: 1px solid rgba(255,50,50,0.15); color: #ff6666; }
        .info-box {
            margin-top: 20px; padding: 16px;
            background: rgba(255,200,0,0.06);
            border: 1px solid rgba(255,200,0,0.1);
            border-radius: 16px; text-align: center;
            color: #ccaa66; font-size: 13px;
        }
        .info-box a { color: #88ddff; text-decoration: none; font-weight: 600; }
        .info-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">Py</div>
            <h1>PyAI</h1>
            <p>Нейросеть нового поколения</p>
        </div>

        <div id="registerForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="email" placeholder="example@mail.ru" />
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="password" placeholder="Придумайте пароль" />
            </div>
            <button id="registerBtn">Зарегистрироваться</button>
            <div id="message" class="message"></div>
            <div class="info-box">
                ⚡ После регистрации ваш аккаунт будет активирован администратором.<br />
                Для получения доступа напишите в <a href="https://t.me/PyAI_bot" target="_blank">@PyAI_bot</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // TURSO НАПРЯМУЮ ЧЕРЕЗ HTTP API
        // ============================================
        const TURSO_URL = 'https://pyai-cursedd.aws-eu-west-1.turso.io/v1/query';
        const TURSO_TOKEN = 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODc4Mzg2OTAsImlkIjoiMDFhMDQzN2QtMmQwMS03ZjZmLTk1MDAtNTUzZTI5YzFjNmI1Iiwia2lkIjoicWpYbEhLbElGQmJNX29uRDlaWEkyWFVfazVBT3h3X3JIMF9TcUZ6MmU0ZyIsInJpZCI6IjZhMzk2M2ZkLWYzM2QtNGE2MS1hMTQwLTQyYWU1ZTExZWQ5NCJ9.2pxIFQ_FkjhaNgqU6Adj6pEOaSxRx_rVI6Jc8SdAbvLMYbXWxsyhH8q78TZKcCQ51m7RiitFUzfOGUr-2UalAg';

        async function tursoQuery(sql, params = []) {
            const payload = {
                requests: [{
                    type: 'execute',
                    stmt: { sql: sql, args: params }
                }]
            };

            try {
                const response = await fetch(TURSO_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TURSO_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Turso error:', error);
                return null;
            }
        }

        async function checkUserExists(email) {
            const result = await tursoQuery('SELECT id FROM users WHERE email = ?', [email]);
            if (!result || !result.results) return false;
            const rows = result.results[0].rows || [];
            return rows.length > 0;
        }

        async function registerUser(email, password) {
            const result = await tursoQuery(
                'INSERT INTO users (email, password, subscription_status) VALUES (?, ?, "inactive")',
                [email, password]
            );
            return result !== null;
        }

        // ============================================
        // ОБРАБОТЧИК ФОРМЫ
        // ============================================
        document.getElementById('registerBtn').addEventListener('click', async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageEl = document.getElementById('message');

            if (!email || !password) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Заполните все поля';
                return;
            }

            if (password.length < 4) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Пароль должен быть не менее 4 символов';
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ Регистрация...';

            try {
                // Проверяем, существует ли пользователь
                const exists = await checkUserExists(email);
                if (exists) {
                    messageEl.className = 'message error';
                    messageEl.textContent = '❌ Пользователь с таким email уже существует';
                    this.disabled = false;
                    this.textContent = 'Зарегистрироваться';
                    return;
                }

                // Регистрируем
                const success = await registerUser(email, password);
                if (success) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✅ Регистрация успешна! Ожидайте активации администратором.';
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = '❌ Ошибка регистрации. Попробуйте позже.';
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Ошибка: ' + error.message;
            }

            this.disabled = false;
            this.textContent = 'Зарегистрироваться';
        });
    </script>
</body>
</html>
