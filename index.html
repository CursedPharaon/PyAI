<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyAI — Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 40%, #1a1f35, #07090f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(12, 16, 35, 0.8);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 40px 30px;
            border: 1px solid rgba(0, 180, 255, 0.2);
            box-shadow: 0 30px 80px rgba(0, 80, 255, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #0088ff, #4400ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 800;
            color: white;
            margin: 0 auto 10px;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.3);
        }

        .logo h1 {
            font-size: 32px;
            background: linear-gradient(90deg, #00ccff, #7766ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            color: #667799;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #8899bb;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
            color: #e0e8ff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: rgba(0, 180, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.08);
        }

        .form-group input::placeholder {
            color: #556688;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #0088ff, #5500ff);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.15);
            margin-top: 6px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(0, 100, 255, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(0, 255, 150, 0.08);
            border: 1px solid rgba(0, 255, 150, 0.15);
            color: #66ffaa;
        }

        .message.error {
            display: block;
            background: rgba(255, 50, 50, 0.08);
            border: 1px solid rgba(255, 50, 50, 0.15);
            color: #ff6666;
        }

        .info-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255, 200, 0, 0.06);
            border: 1px solid rgba(255, 200, 0, 0.1);
            border-radius: 16px;
            text-align: center;
            color: #ccaa66;
            font-size: 13px;
        }

        .info-box a {
            color: #88ddff;
            text-decoration: none;
            font-weight: 600;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        .subscription-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            display: none;
        }

        .subscription-status.active {
            display: block;
            background: rgba(0, 255, 150, 0.06);
            border: 1px solid rgba(0, 255, 150, 0.1);
            color: #66ffaa;
        }

        .subscription-status.inactive {
            display: block;
            background: rgba(255, 200, 0, 0.06);
            border: 1px solid rgba(255, 200, 0, 0.1);
            color: #ccaa66;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">Py</div>
            <h1>PyAI</h1>
            <p>Нейросеть нового поколения</p>
        </div>

        <div id="registerForm">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="email" placeholder="example@mail.ru" />
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="password" placeholder="Придумайте пароль" />
            </div>
            <button id="registerBtn">Зарегистрироваться</button>

            <div id="message" class="message"></div>

            <div id="subscriptionStatus" class="subscription-status"></div>

            <div class="info-box">
                ⚡ После регистрации ваш аккаунт будет активирован администратором.<br />
                Для получения доступа напишите в <a href="https://t.me/PyAI_bot" target="_blank">@PyAI_bot</a>
            </div>
        </div>

        <div id="subscribedContent" style="display: none;">
            <div style="text-align: center; padding: 20px 0;">
                <div style="font-size: 48px; margin-bottom: 16px;">🎉</div>
                <h2 style="color: #66ffaa; margin-bottom: 8px;">Доступ активирован!</h2>
                <p style="color: #8899bb;">Вы можете пользоваться PyAI без ограничений.</p>
                <div style="margin-top: 20px; padding: 16px; background: rgba(0, 255, 150, 0.05); border-radius: 16px; border: 1px solid rgba(0, 255, 150, 0.1);">
                    <p style="color: #66ffaa; font-size: 14px;">✅ Подписка активна</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;

        async function checkSubscription(email) {
            try {
                const response = await fetch(`${API_URL}/check-subscription?email=${encodeURIComponent(email)}`);
                const data = await response.json();
                return data.status;
            } catch (e) {
                return null;
            }
        }

        document.getElementById('registerBtn').addEventListener('click', async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('subscriptionStatus');

            if (!email || !password) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Заполните все поля';
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ Регистрация...';

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                const text = await response.text();

                if (response.ok) {
                    messageEl.className = 'message success';
                    messageEl.textContent = '✅ ' + text;

                    // Проверяем статус подписки
                    setTimeout(async () => {
                        const status = await checkSubscription(email);
                        if (status === 'active') {
                            statusEl.className = 'subscription-status active';
                            statusEl.textContent = '🎉 Подписка активна! Добро пожаловать в PyAI!';
                            document.getElementById('registerForm').style.display = 'none';
                            document.getElementById('subscribedContent').style.display = 'block';
                        } else {
                            statusEl.className = 'subscription-status inactive';
                            statusEl.textContent = '⏳ Ожидайте активации администратором';
                        }
                    }, 2000);

                } else {
                    messageEl.className = 'message error';
                    messageEl.textContent = '❌ ' + text;
                }
            } catch (error) {
                messageEl.className = 'message error';
                messageEl.textContent = '❌ Ошибка подключения к серверу';
            }

            this.disabled = false;
            this.textContent = 'Зарегистрироваться';
        });

        // Проверяем статус при загрузке (если email сохранён)
        const savedEmail = localStorage.getItem('pyai_email');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
        }
    </script>
</body>
</html>
